name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventory-backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/inventory-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=https://${{ secrets.PRODUCTION_DOMAIN }}/api
            VITE_SOCKET_URL=https://${{ secrets.PRODUCTION_DOMAIN }}
            VITE_DEPLOYMENT_MODE=saas
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventory-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/inventory-frontend:latest

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/inventory
            docker compose --env-file .env.production pull backend frontend
            docker compose --env-file .env.production up -d --no-deps backend frontend
            sleep 15
            ./scripts/health-check.sh
            docker image prune -f
            echo "Deploy successful: $(date)"
