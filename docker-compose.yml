# Inventory System — production stack for the VPS.
#
# Runs: backend, frontend, redis, meilisearch.
# Expects on the host (set up once, outside this repo — see README "Deployment"):
#   - `shared_db` network with a MongoDB 7 replica set reachable as `mongodb:27017`
#   - `coolify`   network with Coolify's Traefik proxy routing
#        stock.<domain>    -> inventory-frontend:80
#        apistock.<domain> -> inventory-backend:3000
#
# Usage:  cp .env.example .env   # fill in
#         docker compose up -d --build --wait

name: inventory-system

services:
  backend:
    container_name: inventory-backend
    build:
      context: ./backend
      target: production
    env_file: .env
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: saas
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@inventory-redis:6379
      MEILISEARCH_URL: http://inventory-meilisearch:7700
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      # /health returns 503 unless MongoDB and Redis are both reachable
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - backend_tmp:/tmp
    networks:
      - inventory_net
      - shared_db
      - coolify
    restart: unless-stopped

  frontend:
    container_name: inventory-frontend
    build:
      context: ./frontend
      target: production
      args:
        # Baked into the JS bundle at build time — rebuild after changing.
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL in .env}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:?set VITE_SOCKET_URL in .env}
        VITE_DEPLOYMENT_MODE: saas
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - inventory_net
      - coolify
    restart: unless-stopped

  redis:
    # Unique container names: the backend also sits on the `coolify` network,
    # where Coolify runs its own `redis`.
    container_name: inventory-redis
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - inventory_net
    restart: unless-stopped

  meilisearch:
    container_name: inventory-meilisearch
    image: getmeili/meilisearch:v1.7
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?set MEILISEARCH_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - meili_data:/meili_data
    networks:
      - inventory_net
    restart: unless-stopped

volumes:
  redis_data:
  meili_data:
  backend_tmp:

networks:
  inventory_net:
    driver: bridge
  shared_db:
    external: true
  coolify:
    external: true
