# docker/redis.conf

# Persistence
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no

# Also keep RDB snapshots as backup
save 900 1
save 300 10
save 60 10000

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Security (placeholder replaced at runtime)
requirepass REDIS_PASSWORD_PLACEHOLDER

# Performance
tcp-keepalive 300
timeout 0

# Logging
loglevel notice
