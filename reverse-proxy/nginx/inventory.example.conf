# Host-level Nginx virtual host for Inventory System on a shared VPS.
#
# Assumes inventory stack is started with docker-compose.vps.yml,
# where the app gateway binds to 127.0.0.1:18080.

# Redirect HTTP to HTTPS for both domains.
server {
    listen 80;
    server_name stock.example.com apistock.example.com;
    return 301 https://$host$request_uri;
}

# Frontend domain.
server {
    listen 443 ssl http2;
    server_name stock.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API + Socket.IO domain.
server {
    listen 443 ssl http2;
    server_name apistock.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Map helper for websocket upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
