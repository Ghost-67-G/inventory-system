# Inventory System — Coolify deployment (Build Pack: Docker Compose).
#
# Set in the Coolify UI, not here:
#   Domains   frontend -> https://invm.codingstack.site
#             backend  -> https://apiinvm.codingstack.site:3000   (":3000" = container port)
#   Env vars  RESEND_API_KEY (optional). Everything else has a default below or
#             is generated by Coolify (SERVICE_PASSWORD_* "magic" variables,
#             created once on first deploy and kept).
#
# Self-contained: MongoDB runs in this stack as a single-node replica set (rs0),
# which the app needs for transactions. Its healthcheck initiates the replica
# set on first start, so no manual `rs.initiate()` is needed.

services:
  backend:
    build:
      context: ./backend
      target: production
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: saas
      PORT: 3000
      MONGODB_URL: mongodb://root:${SERVICE_PASSWORD_MONGOROOT}@inventory-mongodb:27017/inventory?authSource=admin&replicaSet=rs0
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@inventory-redis:6379
      MEILISEARCH_URL: http://inventory-meilisearch:7700
      MEILISEARCH_KEY: ${SERVICE_PASSWORD_64_MEILI}
      JWT_ACCESS_SECRET: ${SERVICE_PASSWORD_64_JWTACCESS}
      JWT_REFRESH_SECRET: ${SERVICE_PASSWORD_64_JWTREFRESH}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-30}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@codingstack.site}
      FRONTEND_URL: ${FRONTEND_URL:-https://invm.codingstack.site}
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN:-https://invm.codingstack.site}
    depends_on:
      inventory-mongodb:
        condition: service_healthy
      inventory-redis:
        condition: service_healthy
      inventory-meilisearch:
        condition: service_healthy
    healthcheck:
      # /health returns 503 unless MongoDB and Redis are both reachable
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - backend_tmp:/tmp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # Baked into the JS bundle at build time — redeploy after changing.
        VITE_API_URL: ${VITE_API_URL:-https://apiinvm.codingstack.site/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-https://apiinvm.codingstack.site}
        VITE_DEPLOYMENT_MODE: saas
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Service names double as hostnames (MONGODB_URL, REDIS_URL, MEILISEARCH_URL).
  inventory-mongodb:
    image: mongo:7
    # Replica set + auth needs a keyfile; generate it once into the config volume,
    # then hand over to the image's entrypoint (which creates the root user on
    # first start).
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/configdb/keyfile ]; then
          head -c 756 /dev/urandom | base64 > /data/configdb/keyfile
          chmod 400 /data/configdb/keyfile
          chown 999:999 /data/configdb/keyfile
        fi
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all --wiredTigerCacheSizeGB 1
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MONGOROOT}
    healthcheck:
      # Healthy = replica set initiated and this node is primary.
      # The first run initiates rs0; later runs only check.
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - root
        - --password
        - ${SERVICE_PASSWORD_MONGOROOT}
        - --authenticationDatabase
        - admin
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'inventory-mongodb:27017' }] }); quit(1) } if (!db.hello().isWritablePrimary) quit(1)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    restart: unless-stopped

  inventory-redis:
    image: redis:7-alpine
    # Settings from docker/redis.conf, passed as flags (no repo file mount needed).
    command:
      - redis-server
      - --requirepass
      - ${SERVICE_PASSWORD_REDIS}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1 300 10 60 10000"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --tcp-keepalive
      - "300"
    environment:
      REDISCLI_AUTH: ${SERVICE_PASSWORD_REDIS}   # lets the healthcheck's redis-cli authenticate
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

  inventory-meilisearch:
    image: getmeili/meilisearch:v1.7
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${SERVICE_PASSWORD_64_MEILI}
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_config:
  redis_data:
  meili_data:
  backend_tmp:
